<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    # Intentional misconfiguration: admin added this alias to share files
    # but accidentally exposed the entire home directory with indexing on.
    Alias /files/ /home/admin/
    <Directory /home/admin/>
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # mod_status left enabled and world-accessible (another misconfiguration).
    <Location /server-status>
        SetHandler server-status
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
