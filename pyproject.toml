[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "athena-prototype"
version = "0.1.0"
description = "Proof-of-concept agent committee pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40,<1",
    "fastapi>=0.111,<1",
    "psycopg2-binary>=2.9,<3",
    "PyPubSub>=4.0,<5",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6.0,<7",
    "sse-starlette>=2.1,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0,<25",
    "modal>=0.73,<1",
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]
redteam = [
    "pwntools>=4.9,<5",
]

[project.scripts]
athena = "athena.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
