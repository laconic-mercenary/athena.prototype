server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    # Serve /news directly from the news page — no directory redirect, so it works
    # cleanly behind the operator's load balancer regardless of forwarded Host.
    location = /news {
        try_files /news/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
