services:
  athena_web:
    build:
      context: ../../..
      dockerfile: tests/system/redteam_easy/Dockerfile
    command:
      - python
      - server.py
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --verbose               # DEBUG logging: tool calls, model responses, gate/ask activity
    volumes:
      - ../../../artifacts:/app/artifacts
      - ../../ensembles/redteamv1:/app/ensemble:ro
    env_file: ../../../.env
    environment:
      - ENSEMBLE_PATH=/app/ensemble
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - external-net
      - engagement-net

  target:
    build:
      context: meridian
    hostname: target
    ports:
      - "5000:5000"
    networks:
      engagement-net:
        ipv4_address: 10.10.20.30    # static "sandbox" IP leaked via meridian-client-x git history
      db-net: {}

  # Public marketing site (meridian.openintel.to). Static pages only; the OSINT phase
  # scrapes the landing page → /news → the leaked GitHub repo. Separate from `target`.
  # Operator load balancer maps public :80 → host :8002 → this container's :80.
  meridian_web:
    image: nginx:alpine
    hostname: meridian-www
    volumes:
      - ./meridian_web/html:/usr/share/nginx/html:ro
      - ./meridian_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8002:80"
    networks:
      - external-net

  redis:
    image: redis:7-alpine
    hostname: redis
    command: redis-server --requirepass Meridian2024! --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Meridian2024!", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - db-net

  redis_seeder:
    image: redis:7-alpine
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis/seed.sh:/seed.sh:ro
    command: sh /seed.sh
    networks:
      - db-net
    restart: "no"

networks:
  external-net:
    driver: bridge

  engagement-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.10.20.0/24

  db-net:
    driver: bridge
    internal: true
