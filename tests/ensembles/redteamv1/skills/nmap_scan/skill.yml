name: nmap_scan
description: >
  Run an nmap port scan against a target host. Returns raw nmap output plus a parsed
  list of open ports with service and version information.
side_effect: touches_target
parameters:
  target:
    type: string
    description: IP address or hostname to scan.
  ports:
    type: string
    description: Port range to scan (e.g. "1-1000", "22,80,443", "1-65535").
    required: false
  flags:
    type: string
    description: >
      Additional nmap flags as a space-separated string (e.g. "-sV -sC -T4").
      Defaults to "-sV -sC -T4". Do not include -p or the target here.
    required: false
returns: >
  Object with `stdout` (raw nmap output), `returncode` (int), and `open_ports`
  (list of {port, protocol, service, version}).
notes: >
  Requires nmap installed on the harness machine. Scan in two phases: (1) fast discovery —
  ports="1-65535", flags="--min-rate 1000 -T4" (NO -sV/-sC) to find open ports quickly;
  (2) targeted — flags="-sV -sC -T4" on ONLY the discovered ports. Custom ranges (e.g. a
  known dev-server port) are fine. NEVER use -T0/-T1/-T2 (too slow, will time out) or -O
  (OS detection needs root; unavailable in the container).
