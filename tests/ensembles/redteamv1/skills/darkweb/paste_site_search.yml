name: paste_site_search
description: >
  Search indexed paste aggregators (Pastebin / Ghostbin surface index) for leaked credentials,
  config, or dumps associated with a company name or domain. Surface-index tier only.
side_effect: reads_local
parameters:
  query:
    type: string
    description: Company name or domain to search for (e.g. "meridian.openintel.to").
returns: >
  Object with `source`, `query`, `hits` (empty if none), `result`, `coverage`, and
  `deeper_tier_available` (bool — whether an unqueried deeper tier remains).
