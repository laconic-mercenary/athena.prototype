name: leak_forum_search
description: >
  Search surface-indexed leak / hacking forums for posts referencing a company name or domain.
  Public threads only — no invite-only or registration-walled forums.
side_effect: reads_local
parameters:
  query:
    type: string
    description: Company name or domain to search for (e.g. "Meridian Systems" or "meridian-www").
returns: >
  Object with `source`, `query`, `hits` (empty if none), `result`, `coverage`, and
  `deeper_tier_available` (bool — whether an unqueried deeper tier remains).
