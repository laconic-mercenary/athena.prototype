name: red-teaming
version: 1.0.0
description: Full-cycle offensive security engagement — reconnaissance through formal report.
capability_doc: capability.md

# ---
# Workflow graph
# Each node is a committee. Transitions define the valid edges the orchestrator may traverse.
# condition: retry means the orchestrator may loop back (revised brief, same committee).
# condition: operator_approved means the pipeline blocks at an approval gate.
# ---

workflow:
  entry: recon
  nodes:
    recon:
      output_schema: schemas.ReconOutput
      transitions:
        - to: planning
        - to: recon
          condition: retry
          # On retry, the committee's artifact is overwritten by the new run.
    planning:
      output_schema: schemas.PlanOutput
      transitions:
        - to: retrieval
          condition: operator_approved
        - to: planning
          condition: retry
        - to: recon
          condition: retry
    retrieval:
      output_schema: schemas.RetrievalOutput
      transitions:
        - to: reporting
        - to: retrieval
          condition: retry
    reporting:
      output_schema: schemas.ReportOutput
      transitions: []

# ---
# Committees
# leader: agent yml relative to this file
# model: default model for the leader (specialists inherit unless overridden)
# elements[].mode:
#   combine — all specialist outputs are assembled together by the leader
#   compare — N specialists run the same task; leader selects the best output
# elements[].skills: ensemble-level skills granted to all specialists in this element
# ---

committees:
  recon:
    leader: committees/recon/leader.yml
    model: claude-sonnet-4-6
    elements:
      - id: network_scan
        mode: combine
        specialists:
          - committees/recon/elements/network_scan/network_operator.yml
        skills: [nmap_scan, check_port]

      - id: service_probe
        mode: combine
        specialists:
          - committees/recon/elements/service_probe/service_operator.yml
        skills: [ssh_banner, tcp_banner, tls_probe]

      - id: web_crawl
        mode: combine
        specialists:
          - committees/recon/elements/web_crawl/web_operator.yml
        skills: [http_get, http_head, extract_links]

      - id: threat_analysis
        mode: combine
        specialists:
          - committees/recon/elements/threat_analysis/threat_analyst.yml
        model_override: foundation-sec-8b
        provider: ollama
        skills: []   # Foundation-Sec cannot call tools — security fine-tuning broke function calling

  planning:
    leader: committees/planning/leader.yml
    model: claude-sonnet-4-6
    elements:
      - id: network_plan
        mode: compare       # N specialists, same task, leader selects best output
        judge: leader       # leader has full engagement context — best position to evaluate relevance
        instances: 3
        temperatures: [0.3, 0.7, 1.0]
        execution: reasoning_only   # no skills with side effects; harness enforces this
        specialists:
          - committees/planning/elements/network_plan/network_planner.yml
        skills: []

      - id: web_plan
        mode: compare
        judge: leader
        instances: 3
        temperatures: [0.3, 0.7, 1.0]
        execution: reasoning_only
        specialists:
          - committees/planning/elements/web_plan/web_planner.yml
        skills: []

  retrieval:
    leader: committees/retrieval/leader.yml
    model: claude-sonnet-4-6
    elements:
      - id: web_retrieval
        mode: combine
        specialists:
          - committees/retrieval/elements/web_retrieval/web_retriever.yml
        skills: [http_get, http_head, extract_links]

      - id: db_retrieval
        mode: combine
        specialists:
          - committees/retrieval/elements/db_retrieval/db_specialist.yml
        skills: [postgres_query]

  reporting:
    leader: committees/reporting/leader.yml
    model: claude-sonnet-4-6
    elements:
      - id: findings_analysis
        mode: combine
        specialists:
          - committees/reporting/elements/findings_analysis/findings_analyst.yml
        skills: []

      - id: risk_assessment
        mode: combine
        specialists:
          - committees/reporting/elements/risk_assessment/risk_assessor.yml
        skills: []

# ---
# Skills registry
# impl: path::function pointing to the Python callable in the current repo.
# In a distributed ensemble package, impl would be a local path inside skills/.
# ---

skills:
  - id: nmap_scan
    definition: skills/nmap_scan/skill.yml
    impl: src/athena/tools.py::nmap_scan

  - id: check_port
    definition: skills/check_port/skill.yml
    impl: src/athena/tools.py::check_port

  - id: http_get
    definition: skills/http_get/skill.yml
    impl: src/athena/tools.py::http_get

  - id: http_head
    definition: skills/http_head/skill.yml
    impl: src/athena/tools.py::http_head

  - id: ssh_banner
    definition: skills/ssh_banner/skill.yml
    impl: src/athena/tools.py::ssh_banner

  - id: tcp_banner
    definition: skills/tcp_banner/skill.yml
    impl: src/athena/tools.py::tcp_banner

  - id: tls_probe
    definition: skills/tls_probe/skill.yml
    impl: src/athena/tools.py::tls_probe

  - id: extract_links
    definition: skills/extract_links/skill.yml
    impl: src/athena/tools.py::extract_links

  - id: postgres_query
    definition: skills/postgres_query/skill.yml
    impl: src/athena/tools.py::postgres_query

# ---
# Judge types for mode: compare elements
#   leader  — committee leader receives all N outputs and selects/synthesises the best.
#             Leader already holds full engagement context; no extra injection needed.
#             IMPLEMENTED.
#   scorer  — deterministic Python function scores outputs against task.md criteria.
#             RAISES NotImplementedError — not yet implemented.
#   agent   — dedicated judge agent receives all N outputs and task.md, returns best.
#             RAISES NotImplementedError — not yet implemented.
# ---

# ---
# Harness-provided tools (NOT declared here — injected by the harness)
#   summon_operator(name, task)     — recon leader only
#   summon_specialist(name)         — planning, retrieval, reporting leaders
#   record_observation(...)         — recon leader only
# These are pipeline instrumentation tools, not ensemble skills.
# ---
