name: check_port
description: >
  Single-port TCP connect check. Returns whether the port is open and connection
  latency. Use to confirm specific ports of interest identified by nmap_scan.
parameters:
  host:
    type: string
    description: Target hostname. Must be in the ensemble allowlist.
    required: true
  port:
    type: integer
    description: TCP port number to check.
    required: true
returns: >
  PortCheckResult — host, port, is_open (bool), latency_ms (float | null), summary string.
