name: http_get
description: >
  HTTP GET request with bounded timeout and body size. Returns status code, response
  headers, and body (up to 64 KB). Use to retrieve content from paths that returned
  200 on http_head.
parameters:
  url:
    type: string
    description: Full URL including scheme and path. Hostname must be in the ensemble allowlist.
    required: true
returns: >
  HttpGetResult — url, status_code, headers (dict), body (string, max 64 KB), summary string.
